name: 🐛 Bug Report
description: Report a problem or an error with OTthing
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ IMPORTANT RULES BEFORE SUBMITTING
        * **Only one concern per issue!**
        * use latest OTthing firmware version, see page releases
        * Please use the **export function at the bottom of the OTthing web UI on tab "setup"** to gather the required data
        * Attach these exported files to your issue:
          - Log file
          - Status JSON
          - Configuration JSON
          - OT items JSON

  - type: input
    id: hardware
    attributes:
      label: Brand and model of the boiler and room unit
      placeholder: e.g., Thermona Therm 24 KD.A / Roomona 42 X.Y
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: OTthing firmware version
      placeholder: e.g., v1.60
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce & expected behaviour
      placeholder: |
        1. What did you do?
        2. What happened?
        3. What did you expect to happen instead?
    validations:
      required: true